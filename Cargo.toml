# Cargo.toml

# ---------------------------------------------------------
# package
# ---------------------------------------------------------
[package]
name = "network-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description.workspace = true
readme = "README.md"
documentation = "https://docs.rs/network-monitor"
exclude = [
  "/.cargo",
  "/.cbmignore",
  "/.claude",
  "/.cmd",
  "/.docs",
  "/.github",
  "/.gitignore",
  "/.vscode",
  "/.gitignore-private",
  "/.gitignore-public",
  "/CLAUDE.md",
  "/assets/icon/*.webp",
  "/assets/icon/build_icon.py",
  "/vendor",
]

# ---------------------------------------------------------
# binary
# ---------------------------------------------------------
[[bin]]
name = "network-monitor"
path = "src/main.rs"

# ---------------------------------------------------------
# workspace
# ---------------------------------------------------------
[workspace]
resolver = "3"
members = ["crates/network-monitor-core"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/jungho-dev/network-monitor"
keywords = ["packet-analyzer", "network", "tui", "pcap", "monitor"]
categories = ["command-line-utilities", "network-programming"]
description = "Terminal packet analyzer and local egress monitor: live capture, PCAP/PCAPNG, TCP stream reassembly, process attribution, and new-destination alerts."

# ---------------------------------------------------------
# dependencies
# ---------------------------------------------------------
[dependencies]
network-monitor-core.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
ratatui.workspace = true
crossterm.workspace = true
pcap.workspace = true
chrono.workspace = true
toml.workspace = true
regex.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[workspace.dependencies]
network-monitor-core = { path = "crates/network-monitor-core", version = "0.1.1" }
pcap = "2.4.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
nom = "7.1.3"
crossbeam-channel = "0.5.15"
serde_json = "1.0.149"
anyhow = "1.0.102"
thiserror = "2.0.18"
lru = "0.12.5"
libc = "0.2.186"
tempfile = "3.27.0"
md-5 = "0.10.6"
sha2 = "0.10.9"
maxminddb = "0.24.0"
toml = "0.8.23"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
